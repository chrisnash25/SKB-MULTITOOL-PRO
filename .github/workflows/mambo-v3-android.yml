name: Mambo OS V3 Android APK
on:
  workflow_dispatch:
  push:
    branches: [feature/mambo-os-dual-radio]
    paths:
      - 'android/**'
      - '.github/workflows/mambo-v3-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Diagnose Android Gradle environment
        working-directory: android
        run: |
          java -version
          gradle --version
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath --stacktrace
      - name: Build debug APK with full diagnostics
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee ../mambo-android-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mambo-v3-android-build-log
          path: mambo-android-build.log
          if-no-files-found: ignore
      - name: Upload companion APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mambo-os-v3-companion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
