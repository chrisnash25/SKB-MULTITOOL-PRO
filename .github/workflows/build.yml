name: Build firmware
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Compile firmware
        run: pio run -e m5stick-cplus2
      - name: Validate diagnostics and dashboard
        run: tests/run-host-tests.sh
      - name: Build filesystem image
        run: pio run -e m5stick-cplus2 -t buildfs
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: skb-multitool-firmware
          path: .pio/build/m5stick-cplus2/*.bin
