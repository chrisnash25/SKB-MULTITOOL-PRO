name: Build USB Android bridge
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/tactical-ir-library']
    paths:
      - 'android-usb-bridge/**'
      - '.github/workflows/build-usb-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android-usb-bridge :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKB-USB-Bridge-Android-APK
          path: android-usb-bridge/app/build/outputs/apk/debug/app-debug.apk
