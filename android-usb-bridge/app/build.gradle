plugins { id 'com.android.application' }
android {
    namespace 'com.skb.usbbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.skb.usbbridge'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'com.github.mik3y:usb-serial-for-android:3.11.0' }
